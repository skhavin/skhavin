name: Autonomous Contribution Heartbeat

on:
  schedule:
    # Runs at 20:00 UTC (01:30 AM IST) daily
    - cron: '0 20 * * *'
    # Fallback check at 23:15 UTC (near midnight UTC)
    - cron: '15 23 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run regardless of today commit count'
        required: false
        default: 'false'
        type: boolean
      commit_count:
        description: 'Override commit count (leave 0 for intelligent random target)'
        required: false
        default: 0
        type: number

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Author
        run: |
          git config --global user.name "skhavin"
          git config --global user.email "khavindev@gmail.com"

      - name: Evaluate Activity & Generate Varied Light-Green Commits
        run: |
          TODAY=$(date -u +'%Y-%m-%d')
          echo "Evaluating commit density for UTC date: $TODAY"
          
          # Count author commits created today across all known author aliases
          COMMITS_TODAY=$(git log --since="$TODAY 00:00:00" --author="khavindev\|skhavin\|skxdev007\|skhavin.res\|academic.skhavin" --oneline | wc -l)
          echo "Recorded author commits today: $COMMITS_TODAY"
          
          FORCE="${{ github.event.inputs.force }}"
          OVERRIDE_COUNT="${{ github.event.inputs.commit_count }}"
          
          # Random target between 6 and 14 commits for varied, natural light-green squares
          TARGET=$((6 + RANDOM % 9))
          echo "Target commit threshold for today: $TARGET"
          
          if [ -n "$OVERRIDE_COUNT" ] && [ "$OVERRIDE_COUNT" -gt 0 ]; then
            TO_ADD=$OVERRIDE_COUNT
            echo "Using manual override commit count: $TO_ADD"
          elif [ "$COMMITS_TODAY" -ge "$TARGET" ] && [ "$FORCE" != "true" ]; then
            echo "Activity already exceeds target ($COMMITS_TODAY >= $TARGET). Graph is already green."
            exit 0
          else
            TO_ADD=$((TARGET - COMMITS_TODAY))
            if [ "$TO_ADD" -lt 3 ]; then
              TO_ADD=3
            fi
            echo "Commits today ($COMMITS_TODAY) below target ($TARGET). Generating $TO_ADD varied commits..."
          fi
          
          # Varied research commit message templates
          MESSAGES=(
            "chore(telemetry): neural circuit activation sync"
            "chore(research): residual stream task geometry state ping"
            "chore(activity): automated research log sync"
            "chore(telemetry): causal head importance metric checkpoint"
            "chore(interpretability): direct logit attribution stream sync"
            "chore(activity): telemetry stream heartbeat keepalive"
            "chore(experiments): sub-quadratic video event graph metric update"
            "chore(telemetry): geometric KV eviction state verify"
            "chore(research): cross-architecture head knockout telemetry ping"
            "chore(activity): autonomous contribution grid keepalive"
          )
          NUM_TEMPLATES=${#MESSAGES[@]}
          
          for i in $(seq 1 $TO_ADD); do
            TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            HEX=$(openssl rand -hex 4)
            INDEX=$((RANDOM % NUM_TEMPLATES))
            MSG_PREFIX="${MESSAGES[$INDEX]}"
            
            echo "[$TIMESTAMP] Event $i/$TO_ADD [id:$HEX] -> Status: NOMINAL | Density: OPTIMAL" >> .github/activity-feed.log
            
            git add .github/activity-feed.log
            git commit -m "$MSG_PREFIX [$i/$TO_ADD - id:$HEX]"
            sleep 1
          done
          
          echo "Pushing $TO_ADD autonomous commits to remote..."
          git push origin main
