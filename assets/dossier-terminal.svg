<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 405" width="840" height="405">
  <defs>
    <!-- Milled Metal Outer Bezel Gradient -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26292e" />
      <stop offset="30%" stop-color="#16181b" />
      <stop offset="70%" stop-color="#0f1013" />
      <stop offset="100%" stop-color="#060709" />
    </linearGradient>

    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60646e" />
      <stop offset="25%" stop-color="#2d3036" />
      <stop offset="50%" stop-color="#7e8391" />
      <stop offset="75%" stop-color="#202227" />
      <stop offset="100%" stop-color="#41444d" />
    </linearGradient>

    <radialGradient id="screenGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#06120a" />
      <stop offset="65%" stop-color="#030805" />
      <stop offset="100%" stop-color="#010302" />
    </radialGradient>

    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="35%" stop-color="rgba(255,255,255,0.015)" />
      <stop offset="60%" stop-color="rgba(255,255,255,0)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.025)" />
    </linearGradient>

    <radialGradient id="greenLed" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a6f975" />
      <stop offset="40%" stop-color="#52c41a" />
      <stop offset="85%" stop-color="#135200" />
      <stop offset="100%" stop-color="#092b00" />
    </radialGradient>

    <radialGradient id="amberLed" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffe58f" />
      <stop offset="40%" stop-color="#faad14" />
      <stop offset="85%" stop-color="#874d00" />
      <stop offset="100%" stop-color="#472300" />
    </radialGradient>

    <radialGradient id="cyanLed" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#87e8de" />
      <stop offset="40%" stop-color="#13c2c2" />
      <stop offset="85%" stop-color="#00474f" />
      <stop offset="100%" stop-color="#002329" />
    </radialGradient>

    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="textPhosphor" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(0, 0, 0, 0.4)" stroke-width="1.2" />
    </pattern>

    <g id="screw">
      <circle cx="0" cy="0" r="5.5" fill="#15171a" stroke="#3a3e46" stroke-width="0.8" />
      <circle cx="0" cy="0" r="4.2" fill="#25282e" />
      <line x1="-2.8" y1="-2.8" x2="2.8" y2="2.8" stroke="#111316" stroke-width="1.2" />
      <line x1="-2.8" y1="2.8" x2="2.8" y2="-2.8" stroke="#111316" stroke-width="1.2" />
      <circle cx="-1" cy="-1" r="1.5" fill="rgba(255,255,255,0.2)" />
    </g>
  </defs>

  <style>
    .mono-hdr { font-family: 'SF Mono', 'Roboto Mono', 'Fira Code', 'Menlo', 'Courier New', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; fill: #ffffff; }
    .mono-lbl { font-family: 'SF Mono', 'Roboto Mono', 'Fira Code', 'Menlo', 'Courier New', monospace; font-size: 11.5px; font-weight: 700; fill: #5b8c00; letter-spacing: 0.05em; }
    .mono-val { font-family: 'SF Mono', 'Roboto Mono', 'Fira Code', 'Menlo', 'Courier New', monospace; font-size: 11.5px; fill: #ffffff; font-weight: 600; letter-spacing: 0.04em; filter: url(#textPhosphor); }
    .mono-star { font-family: 'SF Mono', 'Roboto Mono', 'Fira Code', 'Menlo', 'Courier New', monospace; font-size: 12px; fill: #73d13d; }
    .mono-tag { font-family: 'SF Mono', 'Roboto Mono', 'Fira Code', 'Menlo', 'Courier New', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; }
    .plate-txt { font-family: 'SF Mono', 'Roboto Mono', 'Fira Code', 'Menlo', 'Courier New', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.16em; fill: #8c929c; }
    @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { animation: cursorBlink 1s infinite; fill: #73d13d; }
  </style>

  <!-- ================= CHASSIS ================= -->
  <rect x="10" y="10" width="820" height="385" rx="12" fill="url(#rimGrad)" stroke="#111" stroke-width="1.5" />
  <rect x="12" y="12" width="816" height="381" rx="10" fill="url(#chassisGrad)" />

  <!-- Screws -->
  <use href="#screw" x="26" y="24" />
  <use href="#screw" x="814" y="24" />
  <use href="#screw" x="26" y="381" />
  <use href="#screw" x="814" y="381" />

  <!-- Top Milled Header Bar -->
  <path d="M 45 15 L 795 15 A 6 6 0 0 1 801 21 L 801 42 L 39 42 L 39 21 A 6 6 0 0 1 45 15 Z" fill="#131518" stroke="#000" stroke-width="1" />
  <line x1="39" y1="42" x2="801" y2="42" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Status LED Cluster -->
  <circle cx="62" cy="28" r="5" fill="#000" stroke="#444" stroke-width="0.8" />
  <circle cx="62" cy="28" r="4.2" fill="url(#greenLed)" filter="url(#greenGlow)" />
  <text x="74" y="32" class="mono-tag" fill="#52c41a">IFF // MODE 5: ONLINE</text>

  <circle cx="240" cy="28" r="4.5" fill="#000" stroke="#444" stroke-width="0.8" />
  <circle cx="240" cy="28" r="3.8" fill="url(#amberLed)" />
  <text x="250" y="32" class="mono-tag" fill="#faad14">CRYPTO: AES-256</text>

  <circle cx="370" cy="28" r="4.5" fill="#000" stroke="#444" stroke-width="0.8" />
  <circle cx="370" cy="28" r="3.8" fill="url(#cyanLed)" />
  <text x="380" y="32" class="mono-tag" fill="#13c2c2">GRID: ACTIVE</text>

  <!-- Nameplate -->
  <rect x="530" y="20" width="250" height="17" rx="3" fill="#0b0d0f" stroke="#2a2e34" stroke-width="0.8" />
  <text x="655" y="32" text-anchor="middle" class="plate-txt">CLASSIFIED DOSSIER 007</text>

  <!-- ================= CRT SCREEN ================= -->
  <rect x="30" y="52" width="780" height="330" rx="8" fill="#000" stroke="#050608" stroke-width="3" />
  <rect x="33" y="55" width="774" height="324" rx="6" fill="url(#screenGrad)" />
  <rect x="33" y="55" width="774" height="324" rx="6" fill="url(#scanlines)" pointer-events="none" />
  <path d="M 33 55 L 450 55 L 200 379 L 33 379 Z" fill="url(#glassReflect)" pointer-events="none" />

  <!-- ================= PURE VECTOR TERMINAL FRAME (ZERO OVERFLOW) ================= -->
  <!-- Vector Border Box with Precision Top Notch -->
  <path d="M 52 82 H 68 M 490 82 H 788 V 344 H 52 V 82" fill="none" stroke="#2b4700" stroke-width="1.2" />
  
  <!-- Header Cut-out Title -->
  <text x="76" y="86" class="mono-hdr">[ Agent Identification // Level-6 Research Clearance ]</text>

  <!-- Terminal Data Rows -->
  <!-- Row 1: Agent Ident -->
  <g transform="translate(64, 114)">
    <text x="0" y="0" class="mono-star">★</text>
    <text x="18" y="0" class="mono-lbl">AGENT IDENT   :</text>
    <text x="145" y="0" class="mono-val">S. KHAVIN (007)</text>
  </g>

  <!-- Row 2: Focus Area -->
  <g transform="translate(64, 140)">
    <text x="0" y="0" class="mono-star">★</text>
    <text x="18" y="0" class="mono-lbl">PRIMARY FOCUS :</text>
    <text x="145" y="0" class="mono-val">MECHANISTIC INTERPRETABILITY • COMPUTATIONAL GEOMETRY</text>
  </g>

  <!-- Row 3: Institution -->
  <g transform="translate(64, 166)">
    <text x="0" y="0" class="mono-star">★</text>
    <text x="18" y="0" class="mono-lbl">INSTITUTION   :</text>
    <text x="145" y="0" class="mono-val">SATHYABAMA INSTITUTE OF SCIENCE &amp; TECH (2023 - 2027)</text>
  </g>

  <!-- Row 4: Academics -->
  <g transform="translate(64, 192)">
    <text x="0" y="0" class="mono-star">★</text>
    <text x="18" y="0" class="mono-lbl">ACADEMICS     :</text>
    <text x="145" y="0" class="mono-val">DUAL DEGREES — SATHYABAMA &amp; UDACITY NEXTGEN SCHOLAR</text>
  </g>

  <!-- Row 5: Mission Scope -->
  <g transform="translate(64, 218)">
    <text x="0" y="0" class="mono-star">★</text>
    <text x="18" y="0" class="mono-lbl">MISSION SCOPE :</text>
    <text x="145" y="0" class="mono-val">CAUSAL CIRCUIT DISSECTION &amp; SUB-QUADRATIC INFERENCE</text>
  </g>

  <!-- Row 6: Publications -->
  <g transform="translate(64, 244)">
    <text x="0" y="0" class="mono-star">★</text>
    <text x="18" y="0" class="mono-lbl">PUBLICATIONS  :</text>
    <text x="145" y="0" class="mono-val">6 FIRST-AUTHOR PREPRINTS [OPENREVIEW / ZENODO]</text>
  </g>

  <!-- Row 7: Fellowships -->
  <g transform="translate(64, 270)">
    <text x="0" y="0" class="mono-star">★</text>
    <text x="18" y="0" class="mono-lbl">FELLOWSHIPS   :</text>
    <text x="145" y="0" class="mono-val">ALGOUNIVERSITY SWE CO-OP (YC) • ATF FELLOW (TOP 5% OF 20K)</text>
  </g>

  <!-- Row 8: Dispatch Hub -->
  <g transform="translate(64, 296)">
    <text x="0" y="0" class="mono-star">★</text>
    <text x="18" y="0" class="mono-lbl">DISPATCH HUB  :</text>
    <text x="145" y="0" class="mono-val" fill="#73d13d">HTTPS://SKHAVIN.GITHUB.IO</text>
    <rect x="330" y="-10" width="8" height="12" class="cursor" />
  </g>

  <!-- Bottom Command Prompt -->
  <text x="54" y="366" class="mono-tag" fill="#73d13d">> SYS_STATUS: ALL SYSTEMS NOMINAL // CLICK TO ACCESS MAINFRAME</text>
</svg>
